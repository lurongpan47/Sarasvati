[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "buddhist-ai-guardrail"
version = "0.1.0"
description = "Reference runtime implementation of the BUDDHIST-AI-CHARTER v1.0 — bodhicitta as an algorithmic constraint."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-SA-4.0" }
authors = [
    { name = "Sarasvatī Project", email = "sarasvati.canon@proton.me" },
]
keywords = ["ai", "ethics", "guardrail", "buddhism", "charter", "safety", "alignment"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Creative Commons Attribution Share Alike 4.0 International (CC-BY-SA-4.0)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/lurongpan47/Sarasvati"
Charter = "https://github.com/lurongpan47/Sarasvati/blob/main/charter/BUDDHIST-AI-CHARTER.md"
Issues = "https://github.com/lurongpan47/Sarasvati/issues"

[tool.hatch.build.targets.wheel]
packages = ["buddhist_ai_guardrail"]

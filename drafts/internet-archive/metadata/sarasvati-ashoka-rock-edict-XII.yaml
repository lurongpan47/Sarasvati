description: >-
  India-branch first sample of the Sarasvatī open Buddhist archive. Girnar
  recension of Aśoka's Major Rock Edict XII (c. 257 BCE), one of the earliest
  surviving royal decrees on religious pluralism anywhere in the world, and
  predating the split of the Buddhist canon. Prakrit text and English from
  Hultzsch 1925 (Corpus Inscriptionum Indicarum vol. 1, PD). Chinese and
  Tibetan columns are Sarasvatī AI drafts awaiting named human review.

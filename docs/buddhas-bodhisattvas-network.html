    background:rgba(16,23,40,.97);border:1px solid rgba(201,150,47,.4);
    border-radius:14px;padding:14px 15px 15px;transform:translateY(140%);

  #card[data-open="1"]{transform:translateY(0)}

  #card .en{font-size:13px;letter-spacing:.05em;color:#E3DACB;margin-top:4px}

  #card .d{font-size:13px;line-height:1.75;margin-top:9px;color:#DED6C4}

  #card .r{font-size:12.5px;line-height:1.95;color:#C3CBDC}

const sim=d3.forceSimulation(N)
  .force('link',d3.forceLink(links).id(d=>d.id).distance(d=>d.r==='五部'?205:78).strength(.35))
  .force('charge',d3.forceManyBody().strength(-260))
  .force('collide',d3.forceCollide(34))
  .force('x',d3.forceX(d=>d.ax?d.ax[0]:0).strength(.34))
  .force('y',d3.forceY(d=>d.ax?d.ax[1]:0).strength(.34))
  .on('tick',tick);

N.forEach(d=>{if(d.pin){d.fx=d.pin[0];d.fy=d.pin[1];d.x=d.pin[0];d.y=d.pin[1];}
  else if(d.ax){d.x=d.ax[0];d.y=d.ax[1];}});

function tick(){
  link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y)
      .attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
  node.attr('transform',d=>`translate(${d.x},${d.y})`);
}

const zoom=d3.zoom().scaleExtent([.12,3]).on('zoom',e=>root.attr('transform',e.transform));
svg.call(zoom);
function center(){
  const w=innerWidth,h=innerHeight;
  svg.transition().duration(500).call(zoom.transform,
    d3.zoomIdentity.translate(w/2,h/2).scale(Math.min(w,h)/1100));
}
function overview(){
  const w=innerWidth,h=innerHeight,pad=70;
  const x0=d3.min(N,d=>d.x),x1=d3.max(N,d=>d.x),y0=d3.min(N,d=>d.y),y1=d3.max(N,d=>d.y);
  const k=Math.min((w-pad)/(x1-x0),(h-pad*2.4)/(y1-y0));
  svg.transition().duration(600).call(zoom.transform,
    d3.zoomIdentity.translate(w/2,h/2).scale(k).translate(-(x0+x1)/2,-(y0+y1)/2));
}

  chips.selectAll('.chip').text(function(){const k=this.dataset.key;return bo?G_BO[k]:G[k].n;});
  document.querySelector('h1').textContent=bo?'སངས་རྒྱས་བྱང་སེམས་ཀྱི་འབྲེལ་བའི་དྲ་རྒྱ།':'诸佛菩萨关系网络';
  document.querySelector('.sub').textContent=bo?'རིགས་ལྔའི་དཀྱིལ་འཁོར་སྙིང་པོར་བྱས་པའི་སྤྲུལ་བརྒྱུད་གདུང་རབས་ཀྱི་དྲ་མིག':'五方曼荼罗为心 · 藏传四派与汉传诸宗法脉 · 点击任一尊';
  document.getElementById('btnCenter').textContent=bo?'དཀྱིལ་དུ་ལོག':'归心';
  document.getElementById('btnAll').textContent=bo?'ཡོངས་མཐོང':'全览';
  document.getElementById('btnLang').textContent=bo?'中文':'བོད་ཡིག';
  if(cur&&card.dataset.open==='1')open(cur);
}
document.getElementById('btnLang').onclick=()=>setLang(lang==='zh'?'bo':'zh');
document.getElementById('btnCenter').onclick=center;
document.getElementById('btnAll').onclick=overview;
addEventListener('resize',()=>center());
center();

// 筛选
const off=new Set();
const chips=d3.select('#chips');
Object.entries(G).forEach(([k,v])=>{
  chips.append('button').attr('class','chip').attr('data-on','1')
    .style('background',v.c).style('color','#101728').text(lang==='bo'?G_BO[k]:v.n)
    .attr('data-key',k)
    .on('click',function(){
      off.has(k)?off.delete(k):off.add(k);
      const on=!off.has(k);
      d3.select(this).attr('data-on',on?'1':'0')
        .style('background',on?v.c:'transparent').style('color',on?'#101728':'#B9C2D4');
      apply();
    });
});
function visible(d){return !off.has(d.g);}
function apply(){
  node.style('display',d=>visible(d)?null:'none');
  link.style('display',d=>visible(d.source)&&visible(d.target)?null:'none');
}

// 详情
const card=document.getElementById('card');
function open(d){
  const bo=lang==='bo';
  card.querySelector('.cn').textContent=bo?(d.tb||d.cn):d.cn;
  card.querySelector('.en').textContent=bo?d.cn:(d.en||'');
  card.querySelector('.sk').textContent=d.sk?'Skt. '+d.sk:'';
  const t3=bo?(d.en||''):(d.tb||'');
  card.querySelector('.tb').textContent=t3+((bo?false:d.cx)?'（音写·非传统定名）':'');
  card.querySelector('.tb').style.display=t3?'block':'none';
  card.querySelector('.tb').style.fontSize=bo?'13px':'17px';
  card.querySelector('.d').textContent=bo?(d.dT||d.d):d.d;
  card.querySelector('.rel').innerHTML=(rels[d.id]||[])
    .map(([o,r])=>`<div class="r"><i>${bo?(R_BO[r]||r):r}</i><b>${bo?(byId[o].tb||byId[o].cn):byId[o].cn}</b></div>`).join('');
  card.dataset.open='1';
  const set=new Set([d.id]);(rels[d.id]||[]).forEach(([o])=>set.add(o));
  node.classed('dim',n=>!set.has(n.id));
  link.classed('dim',l=>l.source.id!==d.id&&l.target.id!==d.id);
}
function clear(){card.dataset.open='0';cur=null;node.classed('dim',false);link.classed('dim',false);}
node.on('click',(e,d)=>{e.stopPropagation();cur=d;open(d);});
document.getElementById('close').onclick=clear;
svg.on('click',clear);
</script>
</body>

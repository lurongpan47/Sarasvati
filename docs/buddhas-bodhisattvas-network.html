<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>诸佛菩萨关系网络图</title>

<style>
  :root{
    --ink:#101728;        /* 夜唐卡底 */
    --ink2:#0A0F1C;
    --paper:#EFE6D2;      /* 贝叶经 */
    --gold:#C9962F;       /* 金线 */
    --vermilion:#C0392F;  /* 朱砂 */
    --malachite:#3E8C72;  /* 石绿 */
    --azurite:#3E6BA8;    /* 青金 */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);
    font-family:"PingFang SC","Noto Sans SC","Hiragino Sans GB",system-ui,sans-serif;
    overscroll-behavior:none}
  #stage{position:fixed;inset:0}
  svg{width:100%;height:100%;display:block;touch-action:none}

  header{position:fixed;top:0;left:0;right:0;padding:14px 16px 10px;
    background:linear-gradient(to bottom,rgba(10,15,28,.96),rgba(10,15,28,0));
    pointer-events:none;z-index:5}
  h1{margin:0;font-family:"Songti SC","STSong","Noto Serif SC",serif;
    font-weight:700;font-size:20px;letter-spacing:.14em}
  .sub{margin-top:4px;font-size:11px;letter-spacing:.08em;color:#9AA6BE}

  #views{margin-top:9px;display:flex;gap:7px;pointer-events:auto}
  .vbtn{background:transparent;border:1px solid rgba(201,150,47,.55);color:var(--gold);
    border-radius:999px;padding:5px 13px;font-size:12px;letter-spacing:.12em;cursor:pointer;
    font-family:"Songti SC","STSong",serif}
  .vbtn:active{background:rgba(201,150,47,.18)}
  #chips{position:fixed;left:0;right:0;bottom:0;z-index:5;
    padding:10px 12px calc(12px + env(safe-area-inset-bottom));
    display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
    background:linear-gradient(to top,rgba(10,15,28,.97) 60%,rgba(10,15,28,0))}
  #chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid rgba(239,230,210,.22);background:transparent;
    color:#B9C2D4;border-radius:999px;padding:6px 11px;font-size:12px;letter-spacing:.06em;
    cursor:pointer;transition:.18s}
  .chip[data-on="1"]{color:var(--ink);border-color:transparent;font-weight:600}
  .chip:focus-visible,.chip:focus{outline:2px solid var(--gold);outline-offset:2px}

  #card{position:fixed;left:10px;right:10px;bottom:58px;z-index:6;
    background:rgba(16,23,40,.97);border:1px solid rgba(201,150,47,.4);
    border-radius:14px;padding:14px 15px 15px;transform:translateY(140%);
    transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:52vh;overflow:auto;
    box-shadow:0 -10px 40px rgba(0,0,0,.5)}
  #card[data-open="1"]{transform:translateY(0)}
  #card .cn{font-family:"Songti SC","STSong","Noto Serif SC",serif;font-size:19px;font-weight:700}
  #card .en{font-size:13px;letter-spacing:.05em;color:#E3DACB;margin-top:4px}
  #card .sk{font-size:12px;letter-spacing:.12em;color:var(--gold);margin-top:3px;font-style:italic}
  #card .tb{font-size:17px;color:#C7D2E6;margin-top:2px;line-height:1.5}
  #card .d{font-size:13px;line-height:1.75;margin-top:9px;color:#DED6C4}
  #card .rel{margin-top:11px;border-top:1px dashed rgba(239,230,210,.18);padding-top:9px}
  #card .r{font-size:12.5px;line-height:1.95;color:#C3CBDC}
  #card .r b{color:var(--paper);font-weight:600}
  #card .r i{color:var(--gold);font-style:normal;font-size:11px;letter-spacing:.08em;margin-right:6px}
  #close{position:absolute;top:9px;right:11px;background:none;border:0;color:#7C879E;font-size:20px;cursor:pointer}

  .node text{pointer-events:none;font-size:11px;fill:#E6DECB;
    font-family:"Songti SC","STSong","Noto Serif SC",serif;letter-spacing:.04em}
  .node.dim{opacity:.13}
  .link.dim{opacity:.05}
  .axis{fill:#6E7A93;font-size:10px;letter-spacing:.3em;
    font-family:"Songti SC","STSong",serif}
  @media (prefers-reduced-motion:reduce){#card{transition:none}}
  @media(min-width:820px){
    #card{left:auto;right:16px;bottom:64px;width:360px;max-height:66vh}
    h1{font-size:24px}
  }
</style>
</head>

const byId=Object.fromEntries(N.map(n=>[n.id,n]));
const links=L.map(([s,t,r])=>({source:s,target:t,r}));
const rels={};
L.forEach(([s,t,r])=>{(rels[s]=rels[s]||[]).push([t,r]);(rels[t]=rels[t]||[]).push([s,r]);});

const svg=d3.select('#svg');
const root=svg.append('g');
const gMandala=root.append('g');
const gLink=root.append('g');
const gNode=root.append('g');

// 曼荼罗底纹（东在下）
[130,205,300].forEach((r,i)=>gMandala.append('circle').attr('r',r)
  .attr('fill','none').attr('stroke','#C9962F').attr('stroke-opacity',i===1?.34:.13)
  .attr('stroke-width',1));
gMandala.append('rect').attr('x',-145).attr('y',-145).attr('width',290).attr('height',290)
  .attr('fill','none').attr('stroke','#C9962F').attr('stroke-opacity',.16)
  .attr('transform','rotate(45)');
[['东',0,268],['南',-268,6],['西',0,-256],['北',268,6]].forEach(([t,x,y])=>
  gMandala.append('text').attr('class','axis').attr('x',x).attr('y',y)
    .attr('text-anchor','middle').text(t));

const link=gLink.selectAll('line').data(links).join('line')
  .attr('class','link').attr('stroke','#EFE6D2').attr('stroke-opacity',.16).attr('stroke-width',1);

const node=gNode.selectAll('g').data(N).join('g').attr('class','node').style('cursor','pointer');
node.append('circle')
  .attr('r',d=>d.pin?11:(d.g==='b'?8:6.5))
  .attr('fill',d=>G[d.g].c)
  .attr('stroke','#101728').attr('stroke-width',1.5);
node.append('text').attr('x',0).attr('y',d=>(d.pin?-17:-12))
  .attr('text-anchor','middle')
  .attr('font-size',d=>d.pin?13:11)
  .text(d=>d.cn);

const sim=d3.forceSimulation(N)
  .force('link',d3.forceLink(links).id(d=>d.id).distance(d=>d.r==='五部'?205:78).strength(.35))
  .force('charge',d3.forceManyBody().strength(-260))
  .force('collide',d3.forceCollide(34))
  .force('x',d3.forceX(d=>d.ax?d.ax[0]:0).strength(.34))
  .force('y',d3.forceY(d=>d.ax?d.ax[1]:0).strength(.34))
  .on('tick',tick);

N.forEach(d=>{if(d.pin){d.fx=d.pin[0];d.fy=d.pin[1];d.x=d.pin[0];d.y=d.pin[1];}
  else if(d.ax){d.x=d.ax[0];d.y=d.ax[1];}});

function tick(){
  link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y)
      .attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
  node.attr('transform',d=>`translate(${d.x},${d.y})`);
}

const zoom=d3.zoom().scaleExtent([.12,3]).on('zoom',e=>root.attr('transform',e.transform));
svg.call(zoom);
function center(){
  const w=innerWidth,h=innerHeight;
  svg.transition().duration(500).call(zoom.transform,
    d3.zoomIdentity.translate(w/2,h/2).scale(Math.min(w,h)/1100));
}
function overview(){
  const w=innerWidth,h=innerHeight,pad=70;
  const x0=d3.min(N,d=>d.x),x1=d3.max(N,d=>d.x),y0=d3.min(N,d=>d.y),y1=d3.max(N,d=>d.y);
  const k=Math.min((w-pad)/(x1-x0),(h-pad*2.4)/(y1-y0));
  svg.transition().duration(600).call(zoom.transform,
    d3.zoomIdentity.translate(w/2,h/2).scale(k).translate(-(x0+x1)/2,-(y0+y1)/2));
}
document.getElementById('btnCenter').onclick=center;
document.getElementById('btnAll').onclick=overview;
addEventListener('resize',()=>center());
center();

// 筛选
const off=new Set();
const chips=d3.select('#chips');
Object.entries(G).forEach(([k,v])=>{
  chips.append('button').attr('class','chip').attr('data-on','1')
    .style('background',v.c).style('color','#101728').text(v.n)
    .on('click',function(){
      off.has(k)?off.delete(k):off.add(k);
      const on=!off.has(k);
      d3.select(this).attr('data-on',on?'1':'0')
        .style('background',on?v.c:'transparent').style('color',on?'#101728':'#B9C2D4');
      apply();
    });
});
function visible(d){return !off.has(d.g);}
function apply(){
  node.style('display',d=>visible(d)?null:'none');
  link.style('display',d=>visible(d.source)&&visible(d.target)?null:'none');
}

// 详情
const card=document.getElementById('card');
function open(d){
  card.querySelector('.cn').textContent=d.cn;
  card.querySelector('.en').textContent=d.en||'';
  card.querySelector('.sk').textContent=d.sk?'Skt. '+d.sk:'';
  card.querySelector('.tb').textContent=d.tb||'';
  card.querySelector('.tb').style.display=d.tb?'block':'none';
  card.querySelector('.d').textContent=d.d;
  card.querySelector('.rel').innerHTML=(rels[d.id]||[])
    .map(([o,r])=>`<div class="r"><i>${r}</i><b>${byId[o].cn}</b></div>`).join('');
  card.dataset.open='1';
  const set=new Set([d.id]);(rels[d.id]||[]).forEach(([o])=>set.add(o));
  node.classed('dim',n=>!set.has(n.id));
  link.classed('dim',l=>l.source.id!==d.id&&l.target.id!==d.id);
}
function clear(){card.dataset.open='0';node.classed('dim',false);link.classed('dim',false);}
node.on('click',(e,d)=>{e.stopPropagation();open(d);});
document.getElementById('close').onclick=clear;
svg.on('click',clear);
